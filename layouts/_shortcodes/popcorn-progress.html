<style>
#countdown-wrap {
    width: 100%;
    height: 160px;
    padding: 20px;
    font-family: arial;
    max-width: 650px;
    margin: 10px auto 10px;
}

#goal {
    font-size: 48px;
    text-align: right;
    color: #888;
    @media only screen and (max-width : 640px) {
        font-size: 16px;
    }
}

#glass {
    width: 100%;
    height: 20px;
    background: #c7c7c7;
    border-radius: 10px;
    float: left;
    overflow: hidden;
}

#progress {
    float: left;
    width: {{ .Get "percentage" }}%;
    height: 20px;
    background: #2ecc71;
    z-index: 333;
}

.goal-stat {
    width: 33%;
    padding: 10px;
    float: left;
    margin: 0;
    color: #888;
    @media only screen and (max-width : 640px) {
        font-size: 12px;
    }
}

.goal-number, .goal-label {
    display: block;
}

.goal-number {
    font-weight: bold;
}

</style>

<div id=countdown-wrap>
    <div id="goal">Goal: ${{ .Get "goal" }}</div>
    <div id="glass">
        <div id="progress"></div>
    </div>
    <div class="goal-stat" style="text-align:left;">
        <span class="goal-number">{{ .Get "percentage" }}%</span>
        <span class="goal-label">Funded</span>
    </div>
    <div class="goal-stat" style="text-align:center;">
        <span class="goal-number">${{ .Get "raised" }}</span>
        <span class="goal-label">Raised</span>
    </div>
    <div class="goal-stat" style="text-align:right;">
        <span class="goal-number"><div id="countdown"></div></span>
        <span class="goal-label">Days to Go</span>
    </div>
</div>

<script type="text/javascript">
    document.addEventListener("DOMContentLoaded", () => {
        const targetDateStr = "{{ .Get "end" }}";

        let today = new Date();
        today.setHours(0, 0, 0, 0);

        let targetDate = new Date(targetDateStr);
        targetDate.setHours(0, 0, 0, 0);

        const differenceInMs = targetDate - today;
        const msPerDay = 24 * 60 *60 * 1000;
        const daysRemaining = Math.ceil(differenceInMs / msPerDay);

        if (daysRemaining < 0) daysRemaining = 0;

        const countdownElement = document.getElementById("countdown");
        countdownElement.innerText = daysRemaining;
    });
</script>
